<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>

  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1a202c">PilotNet — End-to-End Steering Prediction Network</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#718096">Input: Front camera image (200 x 66 x 3, YUV/RGB)  →  Output: Steering angle</text>

  <!-- Input image -->
  <g>
    <rect x="30" y="230" width="90" height="60" rx="4" fill="#2d3748"/>
    <text x="75" y="264" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">Input</text>
    <text x="75" y="308" text-anchor="middle" font-size="10" fill="#4a5568">200x66x3</text>
  </g>
  <line x1="120" y1="260" x2="150" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Normalization -->
  <g>
    <rect x="150" y="235" width="70" height="50" rx="4" fill="#edf2f7" stroke="#a0aec0"/>
    <text x="185" y="256" text-anchor="middle" font-size="10" font-weight="600" fill="#2d3748">Normalize</text>
    <text x="185" y="270" text-anchor="middle" font-size="9" fill="#718096">/255.0</text>
  </g>
  <line x1="220" y1="260" x2="248" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Conv layers -->
  <g>
    <rect x="248" y="180" width="66" height="160" rx="4" fill="#3182ce"/>
    <text x="281" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">Conv1</text>
    <text x="281" y="145" text-anchor="middle" font-size="9" fill="#4a5568">5x5, s2</text>
    <text x="281" y="158" text-anchor="middle" font-size="9" fill="#4a5568">24 filters</text>
  </g>
  <line x1="314" y1="260" x2="336" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="336" y="195" width="60" height="130" rx="4" fill="#3182ce"/>
    <text x="366" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">Conv2</text>
    <text x="366" y="145" text-anchor="middle" font-size="9" fill="#4a5568">5x5, s2</text>
    <text x="366" y="158" text-anchor="middle" font-size="9" fill="#4a5568">36 filters</text>
  </g>
  <line x1="396" y1="260" x2="418" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="418" y="208" width="54" height="104" rx="4" fill="#3182ce"/>
    <text x="445" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">Conv3</text>
    <text x="445" y="145" text-anchor="middle" font-size="9" fill="#4a5568">5x5, s2</text>
    <text x="445" y="158" text-anchor="middle" font-size="9" fill="#4a5568">48 filters</text>
  </g>
  <line x1="472" y1="260" x2="494" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="494" y="220" width="48" height="80" rx="4" fill="#4299e1"/>
    <text x="518" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">Conv4</text>
    <text x="518" y="145" text-anchor="middle" font-size="9" fill="#4a5568">3x3, s1</text>
    <text x="518" y="158" text-anchor="middle" font-size="9" fill="#4a5568">64 filters</text>
  </g>
  <line x1="542" y1="260" x2="564" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="564" y="228" width="42" height="64" rx="4" fill="#4299e1"/>
    <text x="585" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#2b6cb0">Conv5</text>
    <text x="585" y="145" text-anchor="middle" font-size="9" fill="#4a5568">3x3, s1</text>
    <text x="585" y="158" text-anchor="middle" font-size="9" fill="#4a5568">64 filters</text>
  </g>
  <line x1="606" y1="260" x2="628" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Flatten -->
  <g>
    <rect x="628" y="238" width="36" height="44" rx="4" fill="#a0aec0"/>
  </g>
  <text x="646" y="300" text-anchor="middle" font-size="9" fill="#718096">Flatten</text>
  <line x1="664" y1="260" x2="690" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- FC layers -->
  <g>
    <rect x="690" y="150" width="30" height="220" rx="4" fill="#38a169"/>
    <text x="705" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">FC</text>
    <text x="705" y="135" text-anchor="middle" font-size="9" fill="#4a5568">1164</text>
  </g>
  <line x1="720" y1="260" x2="742" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="742" y="185" width="26" height="150" rx="4" fill="#38a169"/>
    <text x="755" y="155" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">FC</text>
    <text x="755" y="170" text-anchor="middle" font-size="9" fill="#4a5568">100</text>
  </g>
  <line x1="768" y1="260" x2="790" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="790" y="210" width="22" height="100" rx="4" fill="#38a169"/>
    <text x="801" y="185" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">FC</text>
    <text x="801" y="200" text-anchor="middle" font-size="9" fill="#4a5568">50</text>
  </g>
  <line x1="812" y1="260" x2="834" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="834" y="228" width="18" height="64" rx="4" fill="#38a169"/>
    <text x="843" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#276749">FC</text>
    <text x="843" y="227" text-anchor="middle" font-size="9" fill="#4a5568">10</text>
  </g>
  <line x1="852" y1="260" x2="878" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <g>
    <circle cx="920" cy="260" r="26" fill="#e53e3e"/>
    <text x="920" y="264" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">θ</text>
  </g>
  <text x="920" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3748">Steering</text>
  <text x="920" y="322" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3748">Angle</text>

  <line x1="946" y1="260" x2="1010" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="1010" y="230" width="150" height="60" rx="6" fill="#1a202c"/>
    <text x="1085" y="255" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Arduino Uno</text>
    <text x="1085" y="272" text-anchor="middle" font-size="9" fill="#cbd5e0">Motor + Driver</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60,420)">
    <rect x="0" y="0" width="16" height="16" fill="#3182ce" rx="2"/>
    <text x="24" y="13" font-size="12" fill="#2d3748">Convolutional layers (feature extraction — edges, lane lines, road texture)</text>
  </g>
  <g transform="translate(60,448)">
    <rect x="0" y="0" width="16" height="16" fill="#38a169" rx="2"/>
    <text x="24" y="13" font-size="12" fill="#2d3748">Fully-connected layers (map visual features to a steering command)</text>
  </g>
  <g transform="translate(60,476)">
    <circle cx="8" cy="8" r="8" fill="#e53e3e"/>
    <text x="24" y="13" font-size="12" fill="#2d3748">Output neuron — single continuous steering angle value</text>
  </g>

  <text x="60" y="530" font-size="12" fill="#4a5568" font-weight="600">Pipeline in this project:</text>
  <text x="60" y="552" font-size="12" fill="#4a5568">Camera frame → pilot_config.py (crop + resize to 200x66) → PilotNet (PyTorch) → ONNX export → real-time inference on device → steering angle → Arduino</text>

  <text x="60" y="595" font-size="10" fill="#a0aec0">Architecture adapted from NVIDIA's "End to End Learning for Self-Driving Cars" (Bojarski et al., 2016)</text>
</svg>
